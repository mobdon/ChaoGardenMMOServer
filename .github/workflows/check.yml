name: Server checks
on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: server
            manifest: Cargo.toml
          - package: tiny-garden-core
            manifest: crates/tiny-garden-core/Cargo.toml
          - package: tiny-garden-games
            manifest: crates/tiny-garden-games/Cargo.toml
    name: Rust (${{ matrix.package }})
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --manifest-path ${{ matrix.manifest }} --check
      - run: cargo clippy --manifest-path ${{ matrix.manifest }} --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path ${{ matrix.manifest }} --locked
      - if: matrix.package == 'server'
        run: cargo build --release --locked
  node-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
  capacity-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tools/capacity-gates.test.mjs
      - run: python3 -m unittest discover -s deploy -p 'test_*.py' -v
      - run: bash deploy/test_update.sh
