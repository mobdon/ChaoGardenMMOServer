[package]
name = "tiny-garden-core"
version = "0.1.0"
edition = "2024"
publish = false
description = "Bounded native Tiny Chao Garden inspection and separate MMO idle training core"

# Standalone checks remain available; the Rust host uses its verified shop reader.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"

[[bin]]
name = "tiny-garden-inspect"
path = "src/bin/inspect.rs"
