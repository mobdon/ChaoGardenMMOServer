[package]
name = "chao-game-server"
version = "0.1.0"
edition = "2024"
description = "Authoritative Chao Garden prototype gameplay server"
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
tiny-garden-games = { path = "crates/tiny-garden-games" }
tiny-garden-core = { path = "crates/tiny-garden-core" }
argon2 = "0.5"
chacha20poly1305 = "0.10"
ureq = "3"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
